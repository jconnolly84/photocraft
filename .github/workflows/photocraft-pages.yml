name: Deploy PhotoCraft to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'photocraft/**'
      - 'custom-build/**'
      - 'host/**'
      - 'font-library/**'
      - 'ai-assets/**'
      - 'scripts/prepare_photocraft.py'
      - '.github/workflows/photocraft-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photocraft-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare static site without changing release files
        run: |
          python scripts/build_font_catalog.py
          python scripts/prepare_photocraft.py
      - name: Check browser integrations
        run: |
          node scripts/test_shortcuts.cjs
          node scripts/test_local_fonts.cjs
          node scripts/test_font_file_import.cjs
          node scripts/test_image_paste.cjs
          node scripts/test_background_removal.cjs
          node scripts/test_start_screen.cjs
      - name: Check local recovery transactions
        run: |
          npm install --prefix "$RUNNER_TEMP/recovery-tests" fake-indexeddb@6.2.8 --no-audit --no-fund
          node scripts/test_recovery.cjs "$RUNNER_TEMP/recovery-tests/node_modules/fake-indexeddb"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
